# Pilot of the case-study service: one task, one run. Use it to check prompts,
# output size (max_tokens), parsing, and cost per unit before the full campaign.
campaign: pilot_casestudy
output_dir: results
seed: 2026
runs: 3
benchmarks:
  casestudy: {}
workers: 2
models:
  builder:
    provider: anthropic
    max_tokens: 64000       # includes thinking/reasoning tokens
    model: claude-sonnet-5-5
  verifier:
    provider: anthropic
    max_tokens: 64000       # includes thinking/reasoning tokens
    model: claude-sonnet-5-5
  verifier_alt:
    provider: openai
    max_tokens: 64000       # includes thinking/reasoning tokens
    model: gpt-5.5-2026-04-23
